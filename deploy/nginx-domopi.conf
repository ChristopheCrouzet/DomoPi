# DomoPi - reverse proxy TLS (exposition Internet)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Validation Let's Encrypt (HTTP-01) : le jeton doit être servi en clair.
    # La redirection est placée dans « location / » et NON au niveau du serveur :
    # un « return » de niveau serveur s'exécute avant le choix de la location et
    # avalerait le challenge (l'ACME suivrait la redirection vers 443, où tout
    # part dans uvicorn -> 404).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    ssl_certificate     /etc/domopi/tls/domopi.crt;
    ssl_certificate_key /etc/domopi/tls/domopi.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:5m;

    # Durcissement basique
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 8m;

    # Limitation de débit sur l'authentification
    location = /api/login {
        limit_req zone=domopi_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/domopi-proxy-params;
    }
    # Import d'une archive de sauvegarde : gros corps de requête et envoi long
    # (la limite réelle est appliquée côté application, backup.MAX_UPLOAD_MB).
    # Les en-têtes sont recopiés au lieu d'inclure domopi-proxy-params : ce
    # fichier fixe proxy_read_timeout à 120 s, et nginx refuse la directive en
    # double dans un même bloc (« proxy_read_timeout directive is duplicate »).
    location = /api/backups/upload {
        client_max_body_size 1024m;
        client_body_timeout 600s;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }
    # Téléchargement d'une archive : la réponse peut être longue à produire
    location ~ ^/api/backups/[^/]+/download$ {
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/domopi-proxy-params;
    }
}
