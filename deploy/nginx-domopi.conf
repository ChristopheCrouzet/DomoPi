# DomoPi - reverse proxy TLS (exposition Internet)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    ssl_certificate     /etc/domopi/tls/domopi.crt;
    ssl_certificate_key /etc/domopi/tls/domopi.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:5m;

    # Durcissement basique
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 8m;

    # Limitation de débit sur l'authentification
    location = /api/login {
        limit_req zone=domopi_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/domopi-proxy-params;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/domopi-proxy-params;
    }
}
